name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies & Build Vite App
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor & Generate Android Project
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.gossaigaon.rider",
            "appName": "Gossaigaon Fleet",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "useLegacyBridge": true
            },
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["google.com"]
              },
              "LocalNotifications": {
                "iconColor": "#16a34a"
              }
            }
          }
          EOF
          npx cap add android

      - name: Configure Firebase, Background GPS, Notifications & Permissions
        run: |
          if [ -f "public/assets/aistudio/google-services_1bf7436c.json" ]; then
            cp public/assets/aistudio/google-services_1bf7436c.json android/app/google-services.json
          fi

          VARS_FILE="android/variables.gradle"
          if [ -f "$VARS_FILE" ]; then
            if ! grep -q "rgcfaIncludeGoogle" "$VARS_FILE"; then
              sed -i 's/ext {/ext {\n    rgcfaIncludeGoogle = true/' "$VARS_FILE"
            fi
            if ! grep -q "androidxCredentialsVersion" "$VARS_FILE"; then
              sed -i "s/ext {/ext {\n    androidxCredentialsVersion = '1.3.0'/" "$VARS_FILE"
            fi
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            let xml = fs.readFileSync(file, "utf8");
            const perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_BACKGROUND_LOCATION",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_LOCATION",
              "android.permission.WAKE_LOCK",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS"
            ];
            const permTags = perms
              .filter(p => !xml.includes(p))
              .map(p => `    <uses-permission android:name="${p}" />`);
            const gpsFeature = "android.hardware.location.gps";
            if (!xml.includes(gpsFeature)) {
              permTags.push(`    <uses-feature android:name="${gpsFeature}" android:required="false" />`);
            }
            if (permTags.length > 0) {
              xml = xml.replace("<application", `${permTags.join("\n")}\n    <application`);
              fs.writeFileSync(file, xml, "utf8");
            }
          ' "$MANIFEST"

          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Sign with Fixed Keystore (If Secret Exists) & Print SHA-1 / SHA-256
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS || 'riderkey' }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || '123456' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || '123456' }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "=== Signing APK with Permanent Keystore Secret ==="
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/rider.jks
            "$APKSIGNER" sign \
              --ks /tmp/rider.jks \
              --ks-key-alias "$KS_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KEY_PASS" \
              "$APK_PATH"
            echo "=== KEYSTORE FINGERPRINTS (FOR FIREBASE CONSOLE) ==="
            keytool -list -v -keystore /tmp/rider.jks -alias "$KS_ALIAS" -storepass "$KS_PASS" | grep -E "SHA1:|SHA256:"
            rm -f /tmp/rider.jks
          else
            echo "=== GRADLE SIGNING REPORT (EPHEMERAL DEBUG KEY) ==="
            (cd android && ./gradlew signingReport)
          fi

          if [ -n "$APKSIGNER" ]; then
            echo "=== FINAL APK VERIFIED CERTIFICATES ==="
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gossaigaon-fleet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
