name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Rider APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 3. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 5. Install Dependencies & Capacitor Plugins
        run: |
          bun install
          bun add @capacitor/core@8 @capacitor/android@8 @capacitor/cli@8 @capacitor/local-notifications@8 @capacitor/push-notifications@8 @capacitor-community/text-to-speech@8

      - name: 6. Build Web App (Vite)
        run: bun run build

      - name: 7. Create Android Project
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi

      - name: 8. Add Firebase, Notification Icon & Phone Permissions
        run: |
          node --input-type=module << 'EOF'
          import fs from 'node:fs';
          import path from 'node:path';

          const fbSrc = path.join('public', 'assets', 'aistudio', 'google-services_1bf7436c.json');
          const fbDest = path.join('android', 'app', 'google-services.json');
          if (fs.existsSync(fbSrc)) {
            fs.copyFileSync(fbSrc, fbDest);
            console.log('Firebase google-services.json copied!');
          }

          // Create monochrome Delivery Bike notification icon in res/drawable
          const drawableDir = path.join('android', 'app', 'src', 'main', 'res', 'drawable');
          fs.mkdirSync(drawableDir, {recursive: true});
          const notifIconXml = `<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M20,5h-3v2h2l1.62,2.43C20.23,9.16 19.64,9 19,9c-2.21,0 -4,1.79 -4,4c0,2.21 1.79,4 4,4s4,-1.79 4,-4c0,-1.28 -0.61,-2.41 -1.54,-3.14L19.99,7.67L20,5zM19,15c-1.1,0 -2,-0.9 -2,-2s0.9,-2 2,-2s2,0.9 2,2S20.1,15 19,15zM5,9c-2.21,0 -4,1.79 -4,4c0,2.21 1.79,4 4,4s4,-1.79 4,-4c0,-0.49 -0.09,-0.96 -0.25,-1.39l3.35,-2.52L13.18,12H11v2h4.12l-2.66,-7H9v2h1.68l-2.27,1.71C7.63,9.67 6.39,9 5,9zM5,15c-1.1,0 -2,-0.9 -2,-2s0.9,-2 2,-2s2,0.9 2,2S6.1,15 5,15z"/>
          </vector>
          `;
          fs.writeFileSync(path.join(drawableDir, 'ic_stat_notification.xml'), notifIconXml, 'utf8');
          console.log('Custom notification icon created!');

          const manifestPath = path.join('android', 'app', 'src', 'main', 'AndroidManifest.xml');
          let manifest = fs.readFileSync(manifestPath, 'utf8');
          const permissions = [
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.CAMERA',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.VIBRATE',
          ];

          const missing = permissions
            .filter((p) => !manifest.includes(p))
            .map((p) => `    <uses-permission android:name="${p}" />`)
            .join('\n');

          if (missing) {
            manifest = manifest.replace('<application', `${missing}\n\n    <application`);
          }

          if (!manifest.includes('com.google.firebase.messaging.default_notification_icon')) {
            manifest = manifest.replace(
              '</application>',
              `        <meta-data\n            android:name="com.google.firebase.messaging.default_notification_icon"\n            android:resource="@drawable/ic_stat_notification" />\n    </application>`,
            );
          }

          fs.writeFileSync(manifestPath, manifest, 'utf8');
          console.log('Manifest updated!');
          EOF

      - name: 9. Sync Web Files & Plugins into Android
        run: bunx cap sync android

      - name: 10. Build APK File
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 11. Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: gossaigaon-fleet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
