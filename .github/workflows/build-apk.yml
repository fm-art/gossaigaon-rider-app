            const appTags = [];
            if (!xml.includes("com.google.firebase.messaging.default_notification_icon")) {
              appTags.push(`        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify" />`);
